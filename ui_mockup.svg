<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background-color:#1E1E1E; font-family:Consolas, monospace;">
    <!-- Title -->
    <text x="20" y="30" fill="#CCCCCC" font-size="20">Proposed UI Layout: Script Editor &amp; Interceptor Selection</text>

    <!-- View 1: Script Editor Window -->
    <g transform="translate(20, 60)">
        <text x="0" y="-10" fill="#4EC9B0" font-size="14">1. Script Editor (New Layout)</text>
        
        <!-- Window Frame -->
        <rect x="0" y="0" width="360" height="250" fill="#252526" stroke="#3F3F46"/>
        
        <!-- Sidebar (File Explorer) -->
        <rect x="0" y="0" width="100" height="250" fill="#1E1E1E" stroke="#3F3F46"/>
        <text x="10" y="20" fill="#808080" font-size="10">EXPLORER</text>
        
        <!-- File Tree -->
        <g transform="translate(10, 40)">
            <text x="0" y="0" fill="#E7E7E7" font-size="11">▼ Scripts</text>
            <text x="10" y="20" fill="#4EC9B0" font-size="11">C# PacketLoader.cs</text>
            <text x="10" y="40" fill="#4EC9B0" font-size="11">C# MyInterceptor.cs</text>
            <text x="10" y="60" fill="#4EC9B0" font-size="11">C# ProxyLog.cs</text>
        </g>
        
        <!-- Editor Area -->
        <rect x="100" y="0" width="260" height="250" fill="#1E1E1E"/>
        <!-- Tab -->
        <rect x="100" y="0" width="100" height="25" fill="#2D2D2D"/>
        <text x="110" y="17" fill="#E7E7E7" font-size="11">MyInterceptor.cs</text>
        <!-- Code -->
        <text x="110" y="50" fill="#569CD6" font-size="10">public class</text>
        <text x="180" y="50" fill="#4EC9B0" font-size="10">MyInterceptor</text>
        <text x="255" y="50" fill="#D4D4D4" font-size="10">:</text>
        <text x="265" y="50" fill="#4EC9B0" font-size="10">IPacketInterceptor</text>
        <text x="110" y="70" fill="#D4D4D4" font-size="10">{</text>
        <text x="130" y="90" fill="#569CD6" font-size="10">public async</text>
        <text x="200" y="90" fill="#4EC9B0" font-size="10">ValueTask</text>
        <text x="255" y="90" fill="#DCDCAA" font-size="10">OnOutboundAsync</text>
        <text x="130" y="110" fill="#D4D4D4" font-size="10">(PacketContext ctx) { ... }</text>
        <text x="110" y="130" fill="#D4D4D4" font-size="10">}</text>

        <!-- Context Menu Hint -->
        <rect x="40" y="70" width="90" height="60" fill="#252526" stroke="#007ACC" stroke-width="1"/>
        <text x="50" y="90" fill="#E7E7E7" font-size="10">New File...</text>
        <text x="50" y="110" fill="#E7E7E7" font-size="10">Rename</text>
        <rect x="40" y="115" width="90" height="15" fill="#04395e"/> <!-- Highlight -->
        <text x="50" y="125" fill="#FFFFFF" font-size="10">Delete</text>
    </g>

    <!-- View 2: MainWindow Integration -->
    <g transform="translate(420, 60)">
        <text x="0" y="-10" fill="#4EC9B0" font-size="14">2. Test Client / Proxy UI</text>
        
        <!-- Window Frame -->
        <rect x="0" y="0" width="360" height="250" fill="#252526" stroke="#3F3F46"/>

        <!-- Send Panel -->
        <rect x="10" y="10" width="340" height="230" fill="#333333" rx="5"/>
        <text x="20" y="30" fill="#E7E7E7" font-size="12" font-weight="bold">Manual Send / Proxy</text>

        <!-- Packet Selection (Existing) -->
        <rect x="20" y="50" width="200" height="30" fill="#1E1E1E" stroke="#3F3F46"/>
        <text x="30" y="70" fill="#E7E7E7" font-size="11">Select Packet: LoginReq</text>

        <!-- New Interceptor Selector -->
        <g transform="translate(20, 100)">
            <text x="0" y="0" fill="#569CD6" font-size="11" font-weight="bold">Active Interceptors:</text>
            <rect x="0" y="10" width="300" height="100" fill="#1E1E1E" stroke="#3F3F46"/>
            
            <!-- Items -->
            <g transform="translate(10, 30)">
                <!-- Item 1 (Checked) -->
                <rect x="0" y="0" width="12" height="12" fill="#007ACC" stroke="#007ACC"/>
                <path d="M2,6 L5,9 L10,2" stroke="white" stroke-width="2" fill="none"/>
                <text x="20" y="10" fill="#E7E7E7" font-size="11">MyInterceptor (Script)</text>

                <!-- Item 2 (Unchecked) -->
                <rect x="0" y="25" width="12" height="12" fill="none" stroke="#808080"/>
                <text x="20" y="35" fill="#808080" font-size="11">ProxyLogger (Script)</text>

                <!-- Item 3 (Checked) -->
                <rect x="0" y="50" width="12" height="12" fill="#007ACC" stroke="#007ACC"/>
                <path d="M2,6 L5,9 L10,2" stroke="white" stroke-width="2" fill="none"/>
                <text x="20" y="60" fill="#E7E7E7" font-size="11">ModifyAuthToken (Script)</text>
            </g>
        </g>
        
        <!-- Hint Text -->
        <text x="20" y="235" fill="#CE9178" font-size="10">* Select which interceptors run for this session</text>
    </g>

    <!-- Arrows -->
    <path d="M 380 180 L 410 180" stroke="#007ACC" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#007ACC" />
        </marker>
    </defs>

</svg>
